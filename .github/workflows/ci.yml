name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_scale:
        description: Run disposable synthetic scale and memory benchmarks
        type: boolean
        default: false

jobs:
  test:
    # Default job: unit, contract, and BDD checks plus lint and type checks.
    # This job is never gated on external configuration.
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run default test selection
        run: python -m pytest -m '(unit or contract or bdd) and not integration'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src

  integration:
    name: integration (disposable loopback server)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run MLflow integration and profile selection
        env:
          MLFLOW_DISABLE_AGENT_HINT: '1'
        run: env -u MLFLOW_TRACKING_URI python -m pytest -m '(integration or profile) and not slow' -q

  scale:
    name: synthetic scale (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_scale }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package with dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run synthetic reference and memory workloads
        env:
          MLFLOW_DISABLE_AGENT_HINT: '1'
        run: >-
          env -u MLFLOW_TRACKING_URI python -m pytest
          tests/integration/test_scale_memory.py tests/integration/test_scale_pipeline.py
          -m slow -q -s --durations=0
